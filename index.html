:root {
  --radius: 0.75rem;
  --background: oklch(0.18 0.002 60);
  --foreground: oklch(0.94 0.008 85);
  --card: oklch(0.22 0.003 60);
  --card-foreground: oklch(0.94 0.008 85);
  --popover: oklch(0.22 0.003 60);
  --popover-foreground: oklch(0.94 0.008 85);
  --primary: oklch(0.74 0.13 262);
  --primary-foreground: oklch(0.16 0.01 262);
  --secondary: oklch(0.25 0.003 60);
  --secondary-foreground: oklch(0.94 0.008 85);
  --muted: oklch(0.25 0.003 60);
  --muted-foreground: oklch(0.62 0.006 80);
  --faint: oklch(0.4 0.004 70);
  --accent: oklch(0.74 0.13 262);
  --accent-foreground: oklch(0.16 0.01 262);
  --destructive: oklch(0.6 0.2 27);
  --destructive-foreground: oklch(0.98 0 0);
  --border: oklch(0.32 0.004 60);
  --input: oklch(0.32 0.004 60);
  --ring: oklch(0.74 0.13 262);
}
@layer base {
  * {
    border-color: var(--color-border);
  }
  html {
    background: var(--color-background);
  }
  body {
    background-color: var(--color-background);
    color: var(--color-foreground);
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
  }
  ::selection {
    background: var(--primary);
    color: var(--primary-foreground);
  }
}
.grain {
  position: fixed;
  inset: -50%;
  z-index: 60;
  pointer-events: none;
  opacity: .07;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  animation: grain 1s steps(6) infinite;
}
@keyframes grain {
  0%,100% {
    transform: translate(0,0);
  }
  20% {
    transform: translate(-5%,3%);
  }
  40% {
    transform: translate(3%,-6%);
  }
  60% {
    transform: translate(-7%,1%);
  }
  80% {
    transform: translate(5%,5%);
  }
}
.label {
  font-family: var(--font-mono);
  font-size: .75rem;
  letter-spacing: .08em;
  text-transform: uppercase;
}
.display {
  font-family: var(--font-display);
  font-variation-settings: "wdth" 70, "wght" 800;
  letter-spacing: -.01em;
  line-height: .86;
  text-transform: uppercase;
}
.wide {
  font-family: var(--font-display);
  font-stretch: 125%;
  font-weight: 400;
  letter-spacing: -.02em;
}
.mask {
  display: inline-block;
  overflow: hidden;
  vertical-align: bottom;
  padding-bottom: .04em;
}
.mask > span {
  display: inline-block;
  transform: translateY(110%);
  transition: transform 1.1s cubic-bezier(.7,0,.2,1);
}
.is-in .mask > span, .mask.is-in > span {
  transform: translateY(0);
}
.fade-up {
  opacity: 0;
  transform: translateY(24px);
  transition: opacity 1s ease, transform 1s cubic-bezier(.2,.7,.2,1);
}
.is-in .fade-up, .fade-up.is-in {
  opacity: 1;
  transform: none;
}
.loader {
  position: fixed;
  inset: 0;
  z-index: 80;
  background: var(--background);
  transition: transform 1s cubic-bezier(.8,0,.2,1);
}
.loader.done {
  transform: translateY(-100%);
}
.loader-bar {
  position: absolute;
  left: 0;
  bottom: 0;
  height: 3px;
  background: var(--primary);
  transition: width .2s linear;
}
.marquee {
  display: flex;
  width: max-content;
  animation: marquee 30s linear infinite;
}
.marquee.rev {
  animation-direction: reverse;
}
.paused .marquee {
  animation-play-state: paused;
}
@keyframes marquee {
  to {
    transform: translateX(-50%);
  }
}
.pill {
  display: inline-flex;
  align-items: center;
  gap: .5rem;
  border-radius: 999px;
  padding: .7rem 1.1rem;
  font-family: var(--font-mono);
  font-size: .75rem;
  letter-spacing: .1em;
  text-transform: uppercase;
  transition: background .3s, color .3s, transform .3s;
}
.pill-primary {
  background: var(--primary);
  color: var(--primary-foreground);
}
.pill-primary:hover {
  background: var(--foreground);
}
.pill-ghost {
  border: 1px solid var(--border);
  color: var(--foreground);
}
.pill-ghost:hover {
  background: var(--foreground);
  color: var(--background);
}
.link-u {
  background: linear-gradient(currentColor,currentColor) 0 100%/0 1px no-repeat;
  transition: background-size .4s;
}
.link-u:hover {
  background-size: 100% 1px;
}
.cursor {
  position: fixed;
  left: 0;
  top: 0;
  z-index: 90;
  pointer-events: none;
  width: 14px;
  height: 14px;
  margin: -7px 0 0 -7px;
  border-radius: 999px;
  background: var(--foreground);
  mix-blend-mode: difference;
  transition: width .3s, height .3s, margin .3s;
}
.cursor.big {
  width: 80px;
  height: 80px;
  margin: -40px 0 0 -40px;
}
.panel-a {
  background: radial-gradient(120% 90% at 20% 10%, oklch(0.55 0.15 262), oklch(0.25 0.08 270));
}
.panel-b {
  background: radial-gradient(120% 90% at 80% 20%, oklch(0.6 0.14 160), oklch(0.22 0.05 200));
}
.panel-c {
  background: radial-gradient(120% 90% at 30% 80%, oklch(0.65 0.17 45), oklch(0.25 0.06 30));
}
.panel-d {
  background: radial-gradient(120% 90% at 70% 70%, oklch(0.6 0.2 25), oklch(0.22 0.07 15));
}
.panel-grid {
  background-image: linear-gradient(oklch(1 0 0 / .08) 1px, transparent 1px), linear-gradient(90deg, oklch(1 0 0 / .08) 1px, transparent 1px);
  background-size: 32px 32px;
}
.liquid-glass {
  background: radial-gradient(135% 100% at 10% 0%, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.015) 100%);
  backdrop-filter: blur(28px) saturate(190%);
  -webkit-backdrop-filter: blur(28px) saturate(190%);
  border: 1px solid rgba(255, 255, 255, 0.09);
  box-shadow: 
    0 24px 48px -12px rgba(0, 0, 0, 0.5),
    inset 0 1px 1px 0 rgba(255, 255, 255, 0.2),
    inset 0 -1px 1px 0 rgba(0, 0, 0, 0.3);
}
.liquid-glass-pill {
  position: relative;
  background: rgba(255, 255, 255, 0.02);
  border: 1px solid rgba(255, 255, 255, 0.05);
  transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
}
.liquid-glass-pill:hover {
  background: rgba(255, 255, 255, 0.06);
  border-color: rgba(255, 255, 255, 0.16);
  transform: translateX(2px);
}
.liquid-glass-pill.active {
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.14) 0%, rgba(255, 255, 255, 0.04) 100%);
  border-color: rgba(255, 255, 255, 0.32);
  box-shadow: 
    0 8px 24px rgba(0, 0, 0, 0.35),
    inset 0 1px 1.5px rgba(255, 255, 255, 0.38),
    0 0 20px rgba(180, 160, 255, 0.12);
}
.no-scrollbar::-webkit-scrollbar {
  display: none;
}
.no-scrollbar {
  -ms-overflow-style: none;
  scrollbar-width: none;
}
@media (prefers-reduced-motion: reduce) {
  .marquee, .grain {
    animation: none;
  }
}
.intro {
  position: fixed;
  inset: 0;
  z-index: 85;
}
.intro__bg {
  position: absolute;
  inset: 0;
  background: var(--background);
}

  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 20px;
}
.intro__logo {
  display: flex;
  align-items: baseline;
  font-family: var(--font-display);
  font-size: clamp(36px, 7.5vw, 130px);
  line-height: 1;
  color: var(--foreground);
}
.intro__clip {
  display: inline-flex;
  overflow: hidden;
  padding: .08em 0;
}
.intro__clip--first {
  text-transform: uppercase;
  letter-spacing: -.01em;
}
.intro__clip--rest {
  letter-spacing: -.02em;
}

  display: inline-block;

  font-style: italic;
}
.intro.in .intro__letter {
  transform: translateY(0);
}
.intro.bold .intro__clip--first .intro__letter {
  font-variation-settings: "wdth" 70, "wght" 800;
  transition-delay: 0s !important;
}
.intro.bold .intro__letter--italic {
  font-variation-settings: "wdth" 115, "wght" 250;
  transition-delay: 0s !important;
}
.intro__box {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  align-self: center;
  width: .8em;
  height: .95em;
  margin: 0 .04em 0 .1em;
  background: var(--primary);
  color: var(--primary-foreground);
  font-style: italic;
  font-variation-settings: "wdth" 110, "wght" 300;
  transform: scale(0) rotate(-90deg);
  transition: transform .9s cubic-bezier(.34,1.56,.64,1) .55s;
}
.intro.in .intro__box {
  transform: scale(1) rotate(0);
}
.intro__meta {
  position: absolute;
  left: 4vw;
  right: 4vw;
  bottom: clamp(24px, 4vw, 48px);
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 20px;
  opacity: 0;
  transition: opacity .8s ease .3s;
}
.intro.in .intro__meta {
  opacity: 1;
}
.intro__role {
  display: flex;
  flex-direction: column;
  gap: 6px;
  font-family: var(--font-mono);
  font-size: 12px;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--muted-foreground);
}
.intro__count {
  font-family: var(--font-display);
  font-variation-settings: "wdth" 70, "wght" 800;
  font-variant-numeric: tabular-nums;
  font-size: clamp(48px, 6vw, 96px);
  line-height: .86;
  color: var(--foreground);
}
.intro__line {
  position: absolute;
  left: 0;
  bottom: 0;
  width: 100%;
  height: 2px;
  background: var(--primary);
  transform-origin: 0 50%;
  transform: scaleX(0);
}
.intro-fly {

.logo {

  align-items: center;
  font-family: var(--font-display);
  font-size: 20px;
  line-height: 1;
}
.logo__first {
  text-transform: uppercase;
  letter-spacing: -.01em;
  font-variation-settings: "wdth" 70, "wght" 800;
}
.logo__box {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: .8em;
  height: .95em;
  margin: 0 .04em 0 .1em;
  background: var(--primary);
  color: var(--primary-foreground);
  font-style: italic;
  font-variation-settings: "wdth" 110, "wght" 300;
}
.logo__rest {
  font-style: italic;
  letter-spacing: -.02em;
  font-variation-settings: "wdth" 115, "wght" 250;
}
.nav-in {
  opacity: 0;
  transition: opacity .6s ease .2s;
}
.nav-in.is-in {
  opacity: 1;
}
.hero__name {
  display: flex;
  flex-direction: column;
  margin: clamp(24px,5vh,56px) 0;
}
.hero__line {
  display: block;
  overflow: hidden;
  white-space: nowrap;
  padding: .04em 0;
  line-height: .86;
}
.hero__line--second {
  text-align: right;
}
.hero__line-inner {
  display: inline-block;
  transform: translateY(105%);
  transition: transform 1.2s cubic-bezier(.16,1,.3,1);
}
.is-in .hero__line-inner {
  transform: translateY(0);
}
